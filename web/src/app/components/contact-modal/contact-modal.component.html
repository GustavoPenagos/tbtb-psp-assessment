@if (isOpen) {
  <div class="modal-backdrop" (click)="close()" role="dialog" aria-modal="true">
    <div class="modal-card" (click)="$event.stopPropagation()">
      <div class="modal-card__header">
        <div>
          <span class="badge badge--emerald">CA-2 • Seguimiento Clínico</span>
          <h3 class="modal-card__title">Registrar Interacción con Paciente</h3>
          <p class="modal-card__subtitle">Paciente: <strong>{{ patientName }}</strong></p>
        </div>
        <button type="button" class="btn-close" (click)="close()" aria-label="Cerrar modal">
          <svg viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M4.293 4.293a1 1 0 011.414 0L10 8.586l4.293-4.293a1 1 0 111.414 1.414L11.414 10l4.293 4.293a1 1 0 01-1.414 1.414L10 11.414l-4.293 4.293a1 1 0 01-1.414-1.414L8.586 10 4.293 5.707a1 1 0 010-1.414z" clip-rule="evenodd"/></svg>
        </button>
      </div>

      <form [formGroup]="form" (ngSubmit)="submit()" class="modal-card__body">
        <div class="form-group">
          <label for="contactDate" class="form-label">Fecha y Hora del Contacto <span class="required">*</span></label>
          <input
            id="contactDate"
            type="datetime-local"
            class="form-control"
            formControlName="contactDate"
          />
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="channel" class="form-label">Canal de Comunicación <span class="required">*</span></label>
            <select id="channel" class="form-select" formControlName="channel">
              @for (c of channels; track c) {
                <option [value]="c">
                  @switch (c) {
                    @case ('PHONE') { 📞 Llamada Telefónica }
                    @case ('WHATSAPP') { 💬 WhatsApp }
                    @case ('EMAIL') { ✉️ Correo Electrónico }
                  }
                </option>
              }
            </select>
          </div>

          <div class="form-group">
            <label for="result" class="form-label">Resultado del Contacto <span class="required">*</span></label>
            <select id="result" class="form-select" formControlName="result">
              @for (r of results; track r) {
                <option [value]="r">
                  @switch (r) {
                    @case ('SUCCESSFUL_CONTACT') { Contacto Exitoso }
                    @case ('NO_ANSWER') { No Contesta }
                    @case ('WRONG_NUMBER') { Número Equivocado }
                    @case ('REFUSED') { Rechazó Atención }
                    @case ('APPOINTMENT_SCHEDULED') { Cita Agendada }
                  }
                </option>
              }
            </select>
          </div>
        </div>

        <div class="form-group">
          <label for="notes" class="form-label">Observaciones Clínicas (Opcional)</label>
          <textarea
            id="notes"
            rows="3"
            class="form-control"
            formControlName="notes"
            placeholder="Describa detalles relevantes de la adherencia o necesidad del paciente..."
            maxlength="500"
          ></textarea>
          <div class="form-hint">Máximo 500 caracteres.</div>
        </div>

        <div class="modal-card__footer">
          <button type="button" class="btn btn--secondary" (click)="close()" [disabled]="isSubmitting">
            Cancelar
          </button>
          <button type="submit" class="btn btn--primary" [disabled]="form.invalid || isSubmitting">
            @if (isSubmitting) {
              <span class="spinner"></span> Guardando...
            } @else {
              Registrar Contacto
            }
          </button>
        </div>
      </form>
    </div>
  </div>
}
